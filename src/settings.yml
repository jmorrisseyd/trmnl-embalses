---
name: Embalses
strategy: polling
polling_verb: get
# Point this at the JSON the GitHub Action publishes for your own fork.
polling_url: https://raw.githubusercontent.com/jmorrisseyd/trmnl-embalses/main/docs/trmnl.json
# Minutes. embalses.net publishes new figures once a week (Tuesdays), so there
# is nothing to gain from polling often.
refresh_interval: 720
dark_mode: false
no_screen_padding: false
custom_fields:
  - keyname: reservoir_ids
    name: Embalses
    field_type: multi_string
    description: >-
      Ids de embalses.net separados por comas, en el orden que quieras verlos.
      El id es el número de la URL: embalses.net/pantano-<b>871</b>-rules.html.
    help_text: Ejemplo:&nbsp;871,795,830
    default: "795,830,816,799"
  - keyname: heading
    name: Título
    field_type: string
    description: Texto de la barra inferior.
    default: Embalses
  - keyname: footer
    name: Pie (con varios embalses)
    field_type: select
    description: Qué resumen mostrar bajo la lista.
    options:
      - España
      - Conjunto
      - Ninguno
    # TRMNL wants the parameterised form of the option here.
    default: espana
